<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Premium Cargas Official Green Gradient -->
    <linearGradient id="cargasGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#009639" />
      <stop offset="40%" stop-color="#008533" />
      <stop offset="100%" stop-color="#006828" />
    </linearGradient>

    <!-- Natural Gas Flame Glow Gradient -->
    <linearGradient id="cargasFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EAA000" />
      <stop offset="40%" stop-color="#FFD200" />
      <stop offset="85%" stop-color="#FFF04D" />
      <stop offset="100%" stop-color="#FFFFF0" />
    </linearGradient>

    <!-- Subtle Flame Inner Core -->
    <linearGradient id="flameCoreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Drop Shadow for Realistic Depth -->
    <filter id="cargasShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#003B14" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="400" height="400" fill="transparent" />

  <!-- MAIN LOTUS / LEAF EMBLEM (GREEN) -->
  <g filter="url(#cargasShadow)">
    <!-- Outer Leaf Silhouette Matching NGV.jpg Exactly -->
    <!-- Symmetrical 3-lobed leaf: top point (200, 25), left wing tip (46, 142), right wing tip (354, 142), bottom bowl (200, 276) -->
    <path d="M 200 25
             C 188 56, 160 102, 132 128
             C 98 116, 68 124, 48 142
             C 42 148, 45 156, 56 163
             C 84 180, 126 232, 200 276
             C 274 232, 316 180, 344 163
             C 355 156, 358 148, 352 142
             C 332 124, 302 116, 268 128
             C 240 102, 212 56, 200 25 Z"
          fill="url(#cargasGreenGrad)" />

    <!-- Inner Hollow Contour for the Flame Opening -->
    <path d="M 200 62
             C 212 88, 230 118, 248 140
             C 222 152, 178 152, 152 140
             C 170 118, 188 88, 200 62 Z"
          fill="#005A20" opacity="0.35" />
  </g>

  <!-- DANCING NATURAL GAS FLAMES (VIBRANT GOLD & AMBER) -->
  <g>
    <!-- Left Curved Flame Tongue -->
    <path d="M 180 188
             C 166 166, 164 134, 180 98
             C 176 117, 180 144, 192 163
             C 194 179, 188 188, 180 188 Z"
          fill="url(#cargasFlameGrad)" />

    <!-- Right Curved Flame Tongue -->
    <path d="M 220 188
             C 234 166, 236 134, 220 98
             C 224 117, 220 144, 208 163
             C 206 179, 212 188, 220 188 Z"
          fill="url(#cargasFlameGrad)" />

    <!-- Center Main Flame Tongue (Tall & Majestic) -->
    <path d="M 200 56
             C 187 94, 183 130, 188 178
             C 192 192, 208 192, 212 178
             C 217 130, 213 94, 200 56 Z"
          fill="url(#cargasFlameGrad)" />

    <!-- Center Flame White-Hot Inner Core -->
    <path d="M 200 82
             C 194 106, 192 128, 195 158
             C 198 166, 202 166, 205 158
             C 208 128, 206 106, 200 82 Z"
          fill="url(#flameCoreGrad)" />
  </g>

  <!-- ARABIC CALLIGRAPHY "كارجاس" (PURE VECTOR PATHS - ZERO FONT DEPENDENCY) -->
  <!-- Rendered in vivid bright golden yellow matching NGV.jpg on the lower green leaf -->
  <g fill="#FFDF00" stroke="#FFDF00" stroke-width="0.8" stroke-linejoin="round">
    <!-- 'ك' (Kaf): slanted upper flag and base connected to 'ا' -->
    <path d="M 136 216 
             C 142 216, 146 226, 144 242 
             L 162 242 
             L 162 216 
             C 162 214, 166 214, 166 216 
             L 166 245 
             C 166 247, 164 248, 161 248 
             L 138 248 
             C 134 248, 131 245, 132 241 
             C 134 233, 135 224, 131 218 
             C 129 215, 132 214, 136 216 Z" />
    <!-- Kaf Top Diagonal Arm -->
    <path d="M 134 218 
             C 138 214, 150 210, 158 208 
             C 160 207, 161 209, 159 211 
             C 151 214, 142 218, 137 222 
             C 135 223, 133 220, 134 218 Z" />

    <!-- 'ر' (Reh): curved swoop dipping below baseline -->
    <path d="M 174 240 
             C 176 240, 178 242, 177 245 
             C 175 251, 171 257, 164 261 
             C 162 262, 160 260, 161 258 
             C 166 254, 170 248, 171 243 
             L 174 240 Z" />

    <!-- 'ج' (Jeem): crown curving from top right down to baseline -->
    <path d="M 188 230 
             C 192 227, 204 226, 212 228 
             C 214 229, 214 232, 211 233 
             C 204 234, 196 235, 192 240 
             L 218 240 
             L 218 216 
             C 218 214, 222 214, 222 216 
             L 222 245 
             C 222 248, 220 248, 216 248 
             L 186 248 
             C 183 248, 183 244, 186 243 
             C 188 242, 191 239, 188 234 
             C 187 232, 187 231, 188 230 Z" />
    <!-- Jeem Nuqta (Diamond Dot) below -->
    <polygon points="202,254 206,258 202,262 198,258" />

    <!-- 'س' (Seen): three teeth and tail -->
    <path d="M 230 248 
             L 230 234 
             C 230 232, 233 232, 234 234 
             L 234 244 
             L 240 244 
             L 240 234 
             C 240 232, 243 232, 244 234 
             L 244 244 
             L 250 244 
             L 250 234 
             C 250 232, 253 232, 254 234 
             L 254 245 
             C 254 252, 248 256, 242 256 
             C 239 256, 239 252, 242 252 
             C 246 252, 249 249, 249 246 
             L 230 246 
             C 228 246, 228 248, 230 248 Z" />
  </g>

  <!-- "NGV" BOLD ITALIC LETTERS (EXACT VECTOR PATHS MATCHING NGV.jpg) -->
  <!-- Slanted by -13 degrees, filled with bright yellow and thick dark green outline -->
  <g transform="matrix(1 0 -0.23 1 76 0)">
    <!-- LETTER 'N' -->
    <path d="M 92 304 
             L 118 304 
             L 142 344 
             L 142 304 
             L 164 304 
             L 164 372 
             L 138 372 
             L 114 332 
             L 114 372 
             L 92 372 Z"
          fill="#FFE000"
          stroke="#008033"
          stroke-width="6.5"
          stroke-linejoin="round"
          paint-order="stroke fill" />

    <!-- LETTER 'G' -->
    <path d="M 236 322 
             L 214 322 
             C 212 316, 206 312, 196 312 
             C 184 312, 176 322, 176 338 
             C 176 354, 184 364, 196 364 
             C 206 364, 212 358, 214 350 
             L 196 350 
             L 196 336 
             L 236 336 
             L 236 366 
             C 228 373, 214 378, 196 378 
             C 170 378, 152 361, 152 338 
             C 152 315, 170 298, 196 298 
             C 214 298, 228 305, 236 322 Z"
          fill="#FFE000"
          stroke="#008033"
          stroke-width="6.5"
          stroke-linejoin="round"
          paint-order="stroke fill" />

    <!-- LETTER 'V' -->
    <path d="M 244 304 
             L 268 304 
             L 284 350 
             L 300 304 
             L 324 304 
             L 297 372 
             L 271 372 Z"
          fill="#FFE000"
          stroke="#008033"
          stroke-width="6.5"
          stroke-linejoin="round"
          paint-order="stroke fill" />
  </g>
</svg>
